name: Shell checks and integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: |
          for script in install.sh bin/*; do
            bash -n "$script"
          done
      - name: Test installation and update behaviour offline
        run: python3 -m unittest discover -s tests -v
